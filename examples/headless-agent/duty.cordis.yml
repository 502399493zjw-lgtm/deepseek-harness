# Add the durable duty capability — domain, trigger seam, run runtime, and the
# model-facing tools — to the real one-shot app.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: storage
            name: '@deepseek-ai/dsh-storage'
          - id: storage-json
            name: '@deepseek-ai/dsh-storage-json'
            config:
              root: .dsh-duty-data
          - id: storage-domain
            name: '@deepseek-ai/dsh-storage-domain'
            config:
              backend: json
          - id: duty
            name: '@deepseek-ai/dsh-duty'
            config:
              defaultMaxConsecutiveFailures: 3
              runHistoryLimit: 50
              triggerEventLimit: 50
          - id: agent-default-model
            name: '@deepseek-ai/dsh-agent-default-model'
            config:
              provider: deepseek-official
              model: deepseek-v4-flash
          - id: duty-trigger
            name: '@deepseek-ai/dsh-duty-trigger'
            config:
              pollIntervalMs: 30000
          - id: duty-trigger-timer
            name: '@deepseek-ai/dsh-duty-trigger-timer'
          - id: duty-runner
            name: '@deepseek-ai/dsh-duty-runner'
            config:
              subagentProvider: fork
              tokenPriceUsdPerMillion: 1
              maxRepairs: 2
          - id: tool-duty
            name: '@deepseek-ai/dsh-tool-duty'
