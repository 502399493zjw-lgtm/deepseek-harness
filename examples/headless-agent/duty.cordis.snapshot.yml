# Replay counterpart to duty.cordis.yml. It includes cordis.yml directly (a
# config patch cannot target an entry behind a nested include), restates the
# duty overlay while replacing the live model with keyless replay.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: storage
            name: '@deepseek-ai/dsh-storage'
          - id: storage-json
            name: '@deepseek-ai/dsh-storage-json'
            config:
              root: .dsh-duty-data
          - id: storage-domain
            name: '@deepseek-ai/dsh-storage-domain'
            config:
              backend: json
          - id: duty
            name: '@deepseek-ai/dsh-duty'
            config:
              defaultMaxConsecutiveFailures: 3
              runHistoryLimit: 50
              triggerEventLimit: 50
          - id: agent-default-model
            name: '@deepseek-ai/dsh-agent-default-model'
            config:
              provider: deepseek-official
              model: deepseek-v4-flash
          - id: duty-trigger
            name: '@deepseek-ai/dsh-duty-trigger'
            config:
              pollIntervalMs: 30000
          - id: duty-trigger-timer
            name: '@deepseek-ai/dsh-duty-trigger-timer'
          - id: duty-runner
            name: '@deepseek-ai/dsh-duty-runner'
            config:
              subagentProvider: fork
              tokenPriceUsdPerMillion: 1
              maxRepairs: 2
          - id: duty-verify
            name: '@deepseek-ai/dsh-duty-verify'
            config:
              verifier: evaluator
          - id: duty-verify-evaluator
            name: '@deepseek-ai/dsh-duty-verify-evaluator'
            config:
              subagentProvider: fork
              maxEvidenceChars: 12000
          - id: tool-duty
            name: '@deepseek-ai/dsh-tool-duty'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
